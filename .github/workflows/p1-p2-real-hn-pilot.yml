name: P1 P2 natural-language HN pilot (free local model)

# One bounded observational experiment; no recurring HN polling, no paid API.
# Changing code/docs does not relaunch this. Manual dispatch for future runs.
on:
  push:
    branches:
      - feature/contextual-intent-genesis-20261103
    paths:
      - .github/workflows/p1-p2-real-hn-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-public-unlabeled-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing minimal WishCatcher dependencies
        run: python -m pip install -r requirements-plugin.txt
      - name: Install ephemeral Ollama (no model-provider API)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/wishcatcher-ollama-install.sh
          sh /tmp/wishcatcher-ollama-install.sh
      - name: Start ephemeral loopback-only model service
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Pull Qwen2.5 1.5B locally (free open weights)
        timeout-minutes: 7
        run: ollama pull qwen2.5:1.5b
      - name: P1 P2 real public HN paired observation (no invented gold labels)
        timeout-minutes: 12
        env:
          WISHCATCHER_CONTEXT_ALLOW_REMOTE: "0"
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
          WISHCATCHER_CONTEXT_LLM_TIMEOUT_SEC: "100"
          WISHCATCHER_WEB_SEARCH_ENABLED: "0"
          WISHCATCHER_MCP_ENABLED: "0"
          WISHCATCHER_DISCOVERY_PERSIST_RAG: "0"
          OLLAMA_NUM_PARALLEL: "1"
        run: python -u scripts/pilot_real_context.py --maximum 12 --per-pack 4 --local-model qwen2.5:1.5b
