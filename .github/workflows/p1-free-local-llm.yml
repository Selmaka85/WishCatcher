name: P1 free local Qwen integration smoke

# One-shot on introduction, manual thereafter. This workflow does not run
# automatically on every PR and does not use any provider API or secrets.
on:
  push:
    branches:
      - feature/contextual-intent-genesis-20261103
    paths:
      - .github/workflows/p1-free-local-llm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Python dependencies
        run: python -m pip install -r requirements-plugin.txt
      - name: Install ephemeral Ollama runtime
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
      - name: Start CPU-only local inference
        run: |
          set -euo pipefail
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-serve.log
          exit 1
      - name: Pull open-weight Qwen2.5 1.5B (no paid API)
        timeout-minutes: 7
        run: ollama pull qwen2.5:1.5b
      - name: Diagnose model schema and admission on a tracked synthetic example
        timeout-minutes: 7
        env:
          WISHCATCHER_CONTEXT_ALLOW_REMOTE: "0"
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
          WISHCATCHER_CONTEXT_MODEL: qwen2.5:1.5b
          WISHCATCHER_WEB_SEARCH_ENABLED: "0"
          WISHCATCHER_MCP_ENABLED: "0"
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          python -u scripts/diagnose_local_llm.py
