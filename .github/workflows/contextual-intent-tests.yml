name: Contextual Intent Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: context-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone plugin dependencies
        run: python -m pip install -r requirements-plugin.txt 'aiohttp>=3.9,<4' 'beautifulsoup4>=4.12,<5' 'praw>=7.7,<9'
      - name: Compile affected backend and tests
        run: python -m compileall -q backend/app/wishcatcher/contextual backend/app/wishcatcher/integrations backend/app/astra_genesis/context_bridge.py backend/app/plugin_app.py backend/app/api/routes/wishes.py backend/app/api/routes/context_plugin.py backend/app/api/models.py backend/app/wishcatcher/parser/intent_reformulator.py backend/app/storage/wish_storage.py backend/app/wishcatcher/scraper/context_collector.py backend/app/main.py scripts tests
      - name: Provider-free contextual intent tests
        env:
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
        run: python -m unittest discover -s tests -v
      - name: Synthetic RO/EN intent-quality comparison
        env:
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
        run: python scripts/evaluate_context.py --dataset benchmarks/context_gold_v1.jsonl


  studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check and build Context Studio
        run: npm run build

  compose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only Compose configuration
        run: cp .env.example .env && docker compose --file compose.yaml config --quiet


  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test-only secrets
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe
          file = Path(".env")
          content = file.read_text()
          content = content.replace("REPLACE_ME_WITH_A_RANDOM_SECRET", token_urlsafe(48))
          content = content.replace("REPLACE_ME_WITH_ANOTHER_RANDOM_SECRET", token_urlsafe(48))
          content = content.replace("WISHCATCHER_IMPORTED_DATA_APPROVED=0",
                                    "WISHCATCHER_IMPORTED_DATA_APPROVED=1")
          content = content.replace("WISHCATCHER_IMPORT_JSONL=",
                                    "WISHCATCHER_IMPORT_JSONL=/imports/ci.jsonl")
          file.write_text(content)
          import json
          folder = Path("imports")
          folder.mkdir(exist_ok=True)
          sample = json.loads(Path("examples/accounting_thread.json").read_text())
          (folder / "ci.jsonl").write_text(json.dumps(sample) + "\n")
          PY
      - name: Build and start the actual backend and Studio containers
        run: docker compose up -d --build --wait
      - name: Verify deployment and protected analysis
        run: |
          set -eu
          curl --fail --silent http://127.0.0.1:8000/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          curl --fail --silent http://127.0.0.1:3000/context | grep -q 'WishCatcher Studio'
          secret="$(grep '^WISHCATCHER_PLUGIN_ACCESS_TOKEN=' .env | cut -d= -f2-)"
          curl --fail --silent --show-error -X POST 'http://127.0.0.1:8000/api/context/analyze' \
            -H "X-WishCatcher-Key: $secret" -H 'Content-Type: application/json' \
            -d '{"conversation":{"post_id":"ci1","post_author":"owner","post_text":"I tried three accounting apps and all are too expensive.","comments":[{"id":"one","author":"owner","text":"I want to finish my invoices faster without spending two hours every day."}]}}' \
            | python -c 'import json,sys; j=json.load(sys.stdin); assert j["frame"]["actionable"],j'
          curl --fail --silent --show-error -X POST 'http://127.0.0.1:8000/api/context/discovery/run' \
            -H "X-WishCatcher-Key: $secret" -H 'Content-Type: application/json' \
            -d '{"sources":["approved_jsonl"],"max_per_source":3,"max_contexts":5}' \
            | python -c 'import json,sys; j=json.load(sys.stdin); assert j["inserted"] == 1,j'
          curl --fail --silent --show-error 'http://127.0.0.1:8000/api/context/discovery/clusters' \
            -H "X-WishCatcher-Key: $secret" \
            | python -c 'import json,sys; j=json.load(sys.stdin); assert len(j["clusters"]) == 1,j'
          dashboard="$(grep '^WISHCATCHER_DASHBOARD_ACCESS_TOKEN=' .env | cut -d= -f2-)"
          curl --fail --silent --show-error -X POST 'http://127.0.0.1:3000/api/context' \
            -H "X-WishCatcher-Admin: $dashboard" -H 'Content-Type: application/json' \
            -d '{"action":"config","payload":{}}' \
            | python -c 'import json,sys; assert json.load(sys.stdin)["rag"]=="sqlite-fts5-graph"'
      - name: Inspect containers on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop smoke services
        if: always()
        run: docker compose down --remove-orphans


  live-hn-scout:
    # Live network smoke is voluntary; avoid uncontrolled HN traffic and CI charges on every PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only provider-free plugin dependencies
        run: python -m pip install -r requirements-plugin.txt
      - name: Real public Hacker News discovery (no account / no AI charges)
        timeout-minutes: 6
        env:
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
          WISHCATCHER_WEB_SEARCH_ENABLED: "0"
          WISHCATCHER_MCP_ENABLED: "0"
        run: python -u scripts/live_discovery_probe.py
