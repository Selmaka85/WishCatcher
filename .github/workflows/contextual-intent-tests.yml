name: Contextual Intent Regression

on:
  push:
    branches:
      - feature/contextual-intent-genesis-20261103
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  context-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standalone plugin dependencies
        run: python -m pip install -r requirements-plugin.txt
      - name: Compile affected backend and tests
        run: python -m compileall -q backend/app/wishcatcher/contextual backend/app/wishcatcher/integrations backend/app/astra_genesis/context_bridge.py backend/app/plugin_app.py backend/app/api/routes/wishes.py backend/app/api/routes/context_plugin.py backend/app/api/models.py backend/app/wishcatcher/parser/intent_reformulator.py backend/app/main.py tests
      - name: Provider-free contextual intent tests
        env:
          WISHCATCHER_CONTEXT_LLM_ENABLED: "0"
        run: python -m unittest discover -s tests -v


  studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check and build Context Studio
        run: npm run build

  compose-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate local-only Compose configuration
        run: cp .env.example .env && docker compose --file compose.yaml config --quiet
